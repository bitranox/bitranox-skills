[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitranox-skills"
# Kept equal to plugins/bitranox/.claude-plugin/plugin.json by repo-gate.py
# (check_version_sync). The plugin manifest is the source of truth; this is the copy
# the build backend can read, and the gate is what stops the two drifting.
version = "7.23.6"
description = "The bitranox Claude Code skill collection: 82 skills and 64 hooks, installable without the plugin marketplace."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bitranox" }]
keywords = ["claude-code", "claude", "anthropic", "agent-skills", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Deliberately none. The hooks run under a bare interpreter with nothing to provision
# them, so they are stdlib-only by design; the CLI keeps that property so
# `uv tool install` cannot fail on a resolve.
dependencies = []

[project.urls]
Homepage = "https://github.com/bitranox/bitranox-skills"
Repository = "https://github.com/bitranox/bitranox-skills"
Changelog = "https://github.com/bitranox/bitranox-skills/blob/master/CHANGELOG.md"

[project.scripts]
bitranox-skills = "bitranox_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitranox_skills"]

[tool.hatch.build.targets.wheel.hooks.custom]
# `hatch_build.py` force-includes plugins/bitranox itself, filtering out every gitignored,
# machine-local path under it. A declarative `force-include` here would ship them regardless of
# any `exclude` config (see that file's docstring for why `only-include` + `sources` cannot
# replace this: it breaks editable installs).
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/bitranox_skills",
    "plugins/bitranox",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "hatch_build.py",
]
# CLAUDE.local.md and .claude-memory/ are already gitignored, so the sdist's normal (non-forced)
# walk already drops them; .remember/ is not gitignored here, so it needs the same explicit
# exclude as the wheel target above.
exclude = ["CLAUDE.local.md", ".claude-memory", ".claude-bx-selflearning", ".remember"]
